[project]
name = "airbnb-tracker"
version = "0.1.0"
description = "Track Airbnb competitor prices, availability and amenities to position your listing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyairbnb>=2.2.2,<3",
    "pyyaml>=6.0",
    "streamlit>=1.67.0",
]

[project.scripts]
airbnb-tracker = "airbnb_tracker.interface.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs>=3.1.0.261029",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airbnb_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: hits the real Airbnb site (run explicitly with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF", "PL", "C4", "RET"]
ignore = ["PLR0913", "PLR2004"]
allowed-confusables = ["–", "×"]  # intentional typography in UI copy

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N802"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["airbnb_tracker"]

[[tool.mypy.overrides]]
module = ["pyairbnb", "pyairbnb.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["airbnb_tracker"]
branch = true
